# ──────────────────────────────────────────────────────────────────────────────
# mise.toml — SINGLE SOURCE OF TRUTH for language runtimes and versioned CLIs.
#
# `make bootstrap` symlinks this file to ~/.config/mise/config.toml, so the same
# list applies globally (any directory) and inside this repo. Do not duplicate
# this list into a script — that is how go=1.25.5 and go=latest drifted apart
# in the previous version of this setup.
#
# RULE: anything listed here must NOT be in the Brewfile. See Brewfile header.
# ──────────────────────────────────────────────────────────────────────────────

[tools]

# --- ☁️ Stackit & cloud ---
"go:github.com/stackitcloud/stackit-cli" = "latest"  # binary is `stackit-cli`
awscli = "latest"        # S3 / object storage

# --- 🏗️ Infrastructure as code ---
terraform = "latest"
tflint = "latest"
terraform-docs = "latest"

# --- ☸️ Kubernetes ---
kubectl = "latest"
helm = "latest"
k9s = "latest"
krew = "latest"

# --- 🧰 Runtimes ---
go = "latest"            # also required to build/update the Stackit CLI
python = "3.12"
node = "lts"             # replaces nvm — see README "What changed"
uv = "latest"

# --- 🐹 Go tooling ---
# golangci-lint belongs with the Go toolchain, not in brew: a lint run fails
# with "export data version" errors whenever it's older than the compiler, so
# the two need to move together.
golangci-lint = "latest"

# These were `go install`-ed into ~/go/bin and declared nowhere, so a reset
# would have silently lost them. gopls in particular is the Go language
# server — without it your editor has no autocomplete or refactoring.
#
# If one of these fails to install, the module path is the thing to check:
# upstream repos move. mockgen notably migrated from github.com/golang/mock
# to go.uber.org/mock.
"go:golang.org/x/tools/gopls" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"go:go.uber.org/mock/mockgen" = "latest"
"go:github.com/volatiletech/sqlboiler/v4" = "latest"
"go:github.com/volatiletech/sqlboiler/v4/drivers/sqlboiler-psql" = "latest"
"go:github.com/jstemmer/go-junit-report/v2" = "latest"
"go:github.com/boumenot/gocover-cobertura" = "latest"

# --- 📦 Node ecosystem ---
pnpm = "latest"          # was a brew install; node is already managed here

# --- 🛠️ Utilities ---
jq = "latest"
yq = "latest"

# ──────────────────────────────────────────────────────────────────────────────
# Tasks
# ──────────────────────────────────────────────────────────────────────────────

[tasks.install-uv-tools]
description = "Install Python CLI tools listed in uv-tools.list (idempotent)"
run = """
#!/usr/bin/env bash
set -euo pipefail

list="${MISE_PROJECT_ROOT:-.}/uv-tools.list"
if [[ ! -f "$list" ]]; then
  echo "No uv-tools.list found at $list. Skipping."
  exit 0
fi

# No --force here: `uv tool install` is a no-op for an already-installed tool,
# which keeps this task idempotent. Ansible relies on that to report changed=0
# on a second run. Upgrades belong to the update-uv-tools task below.
while IFS= read -r spec || [[ -n "$spec" ]]; do
  spec="${spec%%#*}"                      # strip trailing comments
  spec="$(echo "$spec" | xargs || true)"  # trim whitespace
  [[ -z "$spec" ]] && continue

  # word-splitting is intentional: entries may carry flags like `--with ansible`
  # shellcheck disable=SC2086
  uv tool install $spec
done < "$list"
"""

[tasks.update-uv-tools]
description = "Force-reinstall every uv tool at its latest version"
run = """
#!/usr/bin/env bash
set -euo pipefail
uv tool upgrade --all
"""

[tasks.update-all]
description = "Update mise itself, all mise tools, and all uv tools"
run = """
#!/usr/bin/env bash
set -euo pipefail

echo "1/4 updating mise..."
mise self-update -y || echo "   (self-update unavailable — mise may be brew-managed)"

echo "2/4 upgrading mise tools..."
mise upgrade -y

echo "3/4 installing any newly declared uv tools..."
mise run install-uv-tools

echo "4/4 upgrading existing uv tools..."
mise run update-uv-tools
"""
