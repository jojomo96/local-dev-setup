[defaults]
inventory            = inventory.ini
collections_path     = ./collections
roles_path           = ./roles

# Readable YAML task output.
#
# NOT `stdout_callback = yaml` — that resolves to community.general.yaml, which
# was removed in community.general 12.0.0. The feature moved into ansible-core
# itself in 2.13 as `result_format` on the builtin default callback.
stdout_callback      = default
result_format        = yaml

interpreter_python   = auto_silent
host_key_checking    = False
retry_files_enabled  = False

# Per-task timings, handy for spotting which step is slow. Commented out
# because it needs the ansible.posix collection installed, and a missing
# callback plugin is a hard error rather than a warning — not worth risking
# the whole run for timing output. Enable after `make deps` if you want it.
# callbacks_enabled  = ansible.posix.profile_tasks

# Secrets: when you start using ansible-vault, uncomment this and keep the
# vault password itself in KeePass. Left commented so a missing .vault-pass
# file can't break an otherwise working run.
# vault_password_file = ./.vault-pass

[inventory]
# This playbook only ever targets localhost; fail loudly on a bad inventory.
unparsed_is_failed = True
