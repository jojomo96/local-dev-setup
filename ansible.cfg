[defaults]
inventory            = inventory.ini
collections_path     = ./collections
roles_path           = ./roles
stdout_callback      = yaml
# Show a per-task recap so `changed=0` on a second run is easy to assert.
callbacks_enabled    = ansible.posix.profile_tasks
interpreter_python   = auto_silent
host_key_checking    = False
retry_files_enabled  = False
nocows               = 1
# Secrets: when you start using ansible-vault, uncomment this and keep the
# vault password itself in KeePass. Left commented so a missing .vault-pass
# file can't break an otherwise working run.
# vault_password_file = ./.vault-pass

[inventory]
# This playbook only ever targets localhost; fail loudly on a bad inventory.
unparsed_is_failed = True
