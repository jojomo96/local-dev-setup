---
# ──────────────────────────────────────────────────────────────────────────────
# macOS system preferences.
#
# community.general.osx_defaults instead of `defaults write`: it reads the
# current value first, so it only writes when something differs and it reports
# which keys changed. The shell version this replaced fired all 30 writes
# unconditionally on every run and could not tell you what it did.
#
# Nothing here touches security settings (Gatekeeper, FileVault, SIP).
# ──────────────────────────────────────────────────────────────────────────────

- name: Ensure the screenshot directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/Screenshots"
    state: directory
    mode: "0755"

- name: Apply macOS system preferences
  community.general.osx_defaults:
    domain: "{{ item.domain | default('NSGlobalDomain') }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ macos_defaults }}"
  loop_control:
    label: "{{ item.domain | default('NSGlobalDomain') }} : {{ item.key }}"
  notify: macos preferences changed

- name: Apply per-application preferences
  # Per-app settings override NSGlobalDomain for that app only. Used here to
  # get hold-to-repeat in editors while keeping the accent menu (ö/ä/ü)
  # everywhere else.
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ macos_app_defaults | default([]) }}"
  loop_control:
    label: "{{ item.domain }} : {{ item.key }}"

- name: Remind about settings that need a re-login
  ansible.builtin.debug:
    msg: >-
      Applied. Keyboard repeat rate and some Finder settings only appear in
      System Settings after you log out and back in.
