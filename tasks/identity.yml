---
# ──────────────────────────────────────────────────────────────────────────────
# Git identity and SSH/GitHub reporting.
#
# Writes exactly three things, all conditionally: ~/.config/git/identity,
# 0700 on ~/.ssh, and optional SSH commit-signing config. Everything else
# here only looks and reports — it creates no keys and never touches
# ~/.ssh/config.
#
# The fiddly half-hour nobody remembers to script. Name and email are written
# to ~/.config/git/identity (included by the managed ~/.gitconfig), so personal
# data never lands in the repo.
# ──────────────────────────────────────────────────────────────────────────────

- name: Warn when the git identity is not configured
  ansible.builtin.debug:
    msg: >-
      git_user_name / git_user_email are empty in group_vars/all.yml — skipping
      git identity. Commits will fail until you set them.
  when: not (git_user_name | length and git_user_email | length)

- name: Write the git identity include file
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.config/git/identity"
    mode: "0644"
    content: |
      # Managed by Ansible (group_vars/all.yml). Not tracked in the repo.
      [user]
      	name = {{ git_user_name }}
      	email = {{ git_user_email }}
  when: git_user_name | length and git_user_email | length

# ── SSH ─────────────────────────────────────────────────────────────────────
# This playbook deliberately does NOT generate SSH keys or write ~/.ssh/config.
#
# Generating a passphrase-less software key is the wrong default for a
# hardware-backed setup: a Secure Enclave key (Touch ID) is created by
# Secretive, and a FIDO2 key (Token2/YubiKey) must be created interactively
# with the token plugged in and touched. Neither can be scripted here.
#
# Writing a global `Host *  IdentityFile ...` block would also actively break
# a multi-key setup by offering the wrong key first.
#
# ~/.ssh/config is therefore yours to own. See RESET-CHECKLIST.md for a worked
# two-key example (Touch ID for GitHub, Token2 for everything else).

- name: Ensure ~/.ssh exists with safe permissions
  # Permissions only — ssh refuses to use a world-readable directory, and this
  # is the one part that is unambiguously correct to enforce.
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: Inventory the SSH keys present
  ansible.builtin.find:
    paths: "{{ ansible_env.HOME }}/.ssh"
    patterns: "*.pub"
  register: ssh_pubkeys
  changed_when: false

- name: Report SSH key state
  ansible.builtin.debug:
    msg: >-
      {{ (ssh_pubkeys.files | map(attribute='path') | map('basename') | list)
         if ssh_pubkeys.files | length > 0
         else 'No SSH keys found. See RESET-CHECKLIST.md step 5 for the
               Touch ID + Token2 setup; nothing here will create one for you.' }}

# ── Commit signing (optional, off by default) ───────────────────────────────
# GPG is deliberately not used here. If you want signed commits, sign with an
# SSH key instead (git 2.34+, supported by GitHub): it reuses the hardware key
# you already have, so a Secure Enclave key means Touch ID per signature and
# there is no separate GPG keyring to back up before a laptop wipe.
#
# To enable, set git_signing_ssh_key in group_vars/all.yml to the path of the
# PUBLIC key you want to sign with, then upload that same key to GitHub as a
# *signing* key (Settings → SSH and GPG keys → New SSH key → type: Signing).
- name: Enable SSH-based commit signing
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: file
    file: "{{ ansible_env.HOME }}/.config/git/identity"
  loop:
    - { name: gpg.format, value: ssh }
    - { name: user.signingkey, value: "{{ git_signing_ssh_key }}" }
    - { name: commit.gpgsign, value: "true" }
    - { name: tag.gpgsign, value: "true" }
  loop_control:
    label: "{{ item.name }}"
  when: git_signing_ssh_key | default('', true) | length > 0

# ── GitHub ──────────────────────────────────────────────────────────────────
- name: Check gh authentication
  ansible.builtin.command:
    cmd: gh auth status
  register: gh_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Explain the remaining manual steps
  # gh auth login needs a browser, so it cannot be automated here.
  ansible.builtin.debug:
    msg:
      - "gh is not authenticated. Run these yourself:"
      - "  gh auth login"
      - "  gh ssh-key add ~/.ssh/id_ed25519.pub --title '{{ ansible_hostname }}'"
  when: gh_status.rc != 0
