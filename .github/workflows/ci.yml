name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A setup repo rots silently: upstream Homebrew, mise and oh-my-zsh changes
  # break it while you aren't looking. Catch that monthly, not on reset day.
  schedule:
    - cron: "0 6 1 * *"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          pip install --quiet ansible-core ansible-lint yamllint
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install collections
        run: ansible-galaxy install -r requirements.yml

      - run: yamllint .
      - run: ansible-playbook main.yml --syntax-check
      - run: ansible-lint
      - run: shellcheck -x bootstrap.sh scripts/*.sh
      - run: ./scripts/check-duplicates.sh

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Replaces a hand-written regex that only knew four variable names.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: playbook (linux container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the playbook twice and assert changed=0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make test

  macos:
    name: playbook (macos)
    runs-on: macos-latest
    # mise resolves tool versions via the GitHub API: 60 req/hour per IP
    # unauthenticated, which installing ~24 tools can exhaust. The runner
    # token lifts that to 1000/hour and needs no extra configuration.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Runs bootstrap.sh rather than pip-installing Ansible, for two reasons:
      # it tests the exact command a user types on a fresh laptop, and `pip3`
      # on this runner is Homebrew's Python, which PEP 668 blocks from
      # installing into. bootstrap.sh builds its own venv and sidesteps both.
      #
      # The runner ships a large preinstalled brew set; cleanup would spend
      # the whole job uninstalling it, so stay additive here.
      - name: Bootstrap (run 1)
        run: |
          ./bootstrap.sh \
            -e homebrew_cleanup=false \
            -e git_user_name=CI \
            -e git_user_email=ci@example.com

      - name: Resolve the ansible-playbook binary
        run: |
          VENV="$HOME/.local/share/devsetup/bootstrap-venv"
          AP="$HOME/.local/bin/ansible-playbook"
          [ -x "$AP" ] || AP="$VENV/bin/ansible-playbook"
          [ -x "$AP" ] || { echo "::error::no ansible-playbook found"; exit 1; }
          echo "ANSIBLE_PLAYBOOK=$AP" >> "$GITHUB_ENV"
          echo "using $AP"

      - name: Re-run and assert idempotency
        run: |
          "$ANSIBLE_PLAYBOOK" main.yml \
            -e homebrew_cleanup=false \
            -e git_user_name=CI \
            -e git_user_email=ci@example.com | tee run2.log

          # Strip ANSI before matching: a coloured recap line doesn't start
          # with "localhost", so the grep would silently find nothing.
          recap=$(sed -e 's/\x1b\[[0-9;]*m//g' run2.log | grep -E '^localhost +:' || true)
          if [ -z "$recap" ]; then
            echo "::error::Could not find the PLAY RECAP line — assertion is broken"
            exit 1
          fi
          echo "recap: $recap"
          if ! echo "$recap" | grep -q 'changed=0'; then
            echo "::error::Second run was not idempotent"
            sed -e 's/\x1b\[[0-9;]*m//g' run2.log | grep -B1 '^changed:' | grep '^TASK' || true
            exit 1
          fi

      - name: Assert dotfile symlinks point into the repo
        run: |
          for f in .zshrc .zshenv .gitconfig .gitignore_global; do
            target="$(readlink "$HOME/$f" || echo NOT-A-LINK)"
            case "$target" in
              "$PWD"/*) echo "ok   $f -> $target" ;;
              *) echo "::error::$f -> $target"; exit 1 ;;
            esac
          done

      - name: Assert the managed .zshrc loads
        run: |
          zsh -n "$HOME/.zshrc"
          zsh -i -c 'echo "interactive zsh ok"'

      - name: Check mode must be clean on a configured machine
        run: |
          "$ANSIBLE_PLAYBOOK" main.yml --check --diff \
            -e homebrew_cleanup=false \
            -e git_user_name=CI \
            -e git_user_email=ci@example.com
