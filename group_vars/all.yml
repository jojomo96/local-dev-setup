---
# ──────────────────────────────────────────────────────────────────────────────
# The single place to configure this machine.
#
# Package lists live in Brewfile / mise.toml / uv-tools.list rather than here,
# because those are the native formats of their managers and get allowlist
# semantics for free. Everything else is below.
# ──────────────────────────────────────────────────────────────────────────────

# ── Which parts of the playbook to run ──────────────────────────────────────
# Also addressable as tags: ansible-playbook main.yml --tags macos
configure_homebrew: true
configure_omz: true
configure_dotfiles: true
configure_mise: true
configure_k9s: true
configure_plugins: true
configure_identity: true
configure_macos: true

# Whether `brew bundle` may UNINSTALL packages missing from the Brewfile.
# This is the mechanism that keeps the garbage off a fresh machine. Set false
# for a first additive run on a machine you aren't ready to prune yet.
homebrew_cleanup: true

# ── Git identity ────────────────────────────────────────────────────────────
# Fill these in. They're written to ~/.config/git/identity, which the managed
# ~/.gitconfig includes — so your name and email never land in the repo.
# Leave empty to skip the identity tasks entirely.
git_user_name: ""
git_user_email: ""

# Optional: sign commits with an SSH key (not GPG). Leave empty for no signing.
# Set to the PUBLIC key path you want to sign with, e.g.
#   git_signing_ssh_key: "~/.ssh/id_ed25519_sk.pub"
# For a Secretive/Secure Enclave key, export its public key to a file first.
# The same key must be added to GitHub as a *Signing* key, not an auth key.
git_signing_ssh_key: ""

# ── Dotfiles: repo path -> target in $HOME ──────────────────────────────────
# Real files already at the destination are backed up with a timestamp before
# being replaced by the symlink.
dotfile_links:
  - src: dotfiles/zsh/.zshrc
    dest: "{{ ansible_env.HOME }}/.zshrc"
  - src: dotfiles/zsh/.zshenv
    dest: "{{ ansible_env.HOME }}/.zshenv"
  - src: dotfiles/git/.gitconfig
    dest: "{{ ansible_env.HOME }}/.gitconfig"
  - src: dotfiles/git/.gitignore_global
    dest: "{{ ansible_env.HOME }}/.gitignore_global"
  # mise.toml is linked, not copied, so the global tool list and this repo's
  # list are physically the same file and cannot drift apart.
  - src: mise.toml
    dest: "{{ ansible_env.HOME }}/.config/mise/config.toml"

# ── oh-my-zsh plugins that aren't bundled ───────────────────────────────────
omz_custom_plugins:
  - name: zsh-bat
    repo: https://github.com/fdellwing/zsh-bat.git

# ── k9s skins and per-context config ────────────────────────────────────────
# On macOS k9s lives in ~/Library/Application Support/k9s (Go's user-config
# dir), not ~/.config/k9s. Note the space in the path.
k9s_config_dir: "{{ ansible_env.HOME }}/Library/Application Support/k9s"

# Contexts whose config.yaml should be seeded from the repo. That file carries
# the `skin:` mapping (e.g. dns -> red) and your curated `favorites` namespace
# list. It is copied only when absent, because k9s writes live state into it.
k9s_cluster_configs:
  - cluster: dns
    context: dns
  - cluster: dns-nonprod
    context: dns-nonprod

# ── kubectl plugins (krew) ──────────────────────────────────────────────────
# oidc-login is not optional: it's what authenticates the OIDC kubeconfig
# (dns-nonprd-oidc). Without it that cluster fails to log in, and nothing
# else in this setup would have restored it.
krew_plugins:
  - oidc-login

# ── Helm chart repositories ─────────────────────────────────────────────────
helm_repos:
  - name: grafana
    url: https://grafana.github.io/helm-charts

# ── Globally-installed pnpm packages ────────────────────────────────────────
# Node CLIs that aren't on any other manager's list.
pnpm_global_packages:
  - cdktf-cli                # Terraform CDK
  - openapi-to-postmanv2

# ── macOS system preferences ────────────────────────────────────────────────
# Applied with community.general.osx_defaults: idempotent, and it tells you
# which keys actually changed. Delete any line you disagree with.
macos_defaults:
  # Keyboard.
  - { key: KeyRepeat, type: int, value: 2 }            # fast repeat
  - { key: InitialKeyRepeat, type: int, value: 15 }
  - { key: AppleKeyboardUIMode, type: int, value: 3 }  # tab through dialogs

  # ApplePressAndHoldEnabled stays TRUE globally: holding "o" to get ö/ü/ä is
  # press-and-hold, and on an English keyboard that is the way to type German
  # letters. Disabling it is a common "dev tweak" that silently removes that.
  #
  # The trade-off is real — press-and-hold and hold-to-repeat are mutually
  # exclusive. So it is disabled PER APP below, only in editors and terminals
  # where key repeat matters and you'd never type an umlaut.
  - { key: ApplePressAndHoldEnabled, type: bool, value: true }

  # Text input — smart quotes and dashes corrupt code and YAML.
  - { key: NSAutomaticQuoteSubstitutionEnabled, type: bool, value: false }
  - { key: NSAutomaticDashSubstitutionEnabled, type: bool, value: false }
  - { key: NSAutomaticCapitalizationEnabled, type: bool, value: false }
  - { key: NSAutomaticSpellingCorrectionEnabled, type: bool, value: false }
  - { key: NSAutomaticPeriodSubstitutionEnabled, type: bool, value: false }

  # Save dialogs
  - { key: NSNavPanelExpandedStateForSaveMode, type: bool, value: true }
  - { key: NSDocumentSaveNewDocumentsToCloud, type: bool, value: false }
  - { key: AppleShowAllExtensions, type: bool, value: true }

  # Trackpad
  - { key: "com.apple.mouse.tapBehavior", type: int, value: 1 }

  # Finder
  - { domain: com.apple.finder, key: AppleShowAllFiles, type: bool, value: true }
  - { domain: com.apple.finder, key: ShowPathbar, type: bool, value: true }
  - { domain: com.apple.finder, key: ShowStatusBar, type: bool, value: true }
  - { domain: com.apple.finder, key: FXDefaultSearchScope, type: string, value: SCcf }
  - { domain: com.apple.finder, key: FXPreferredViewStyle, type: string, value: Nlsv }
  - { domain: com.apple.finder, key: _FXSortFoldersFirst, type: bool, value: true }
  - { domain: com.apple.finder, key: FXEnableExtensionChangeWarning, type: bool, value: false }

  # Stop .DS_Store on network/USB volumes — they end up committed to repos.
  - { domain: com.apple.desktopservices, key: DSDontWriteNetworkStores, type: bool, value: true }
  - { domain: com.apple.desktopservices, key: DSDontWriteUSBStores, type: bool, value: true }

  # Dock — only the uncontroversial one. Nothing here touches `orientation`,
  # so a left-hand dock stays left. autohide / tilesize / mru-spaces are
  # personal layout choices, so they're left commented rather than imposed.
  - { domain: com.apple.dock, key: show-recents, type: bool, value: false }
  - { domain: com.apple.dock, key: autohide, type: bool, value: true }
  # - { domain: com.apple.dock, key: autohide-delay, type: float, value: 0 }
  # - { domain: com.apple.dock, key: autohide-time-modifier, type: float, value: 0.15 }
  # - { domain: com.apple.dock, key: tilesize, type: int, value: 42 }
  # - { domain: com.apple.dock, key: mru-spaces, type: bool, value: false }

  # Screenshots
  - { domain: com.apple.screencapture, key: location, type: string, value: "{{ ansible_env.HOME }}/Screenshots" }
  - { domain: com.apple.screencapture, key: disable-shadow, type: bool, value: true }
  - { domain: com.apple.screencapture, key: type, type: string, value: png }

# ── Per-app overrides ───────────────────────────────────────────────────────
# Disable press-and-hold only where you want hold-to-repeat and would never
# type an umlaut. Everywhere else (Slack, browsers, Notes, Mail) keeps the
# accent menu, so holding "o" still gives ö.
#
# Find an app's bundle id with:
#   osascript -e 'id of app "GoLand"'
macos_app_defaults:
  - { domain: com.googlecode.iterm2, key: ApplePressAndHoldEnabled, type: bool, value: false }
  - { domain: com.microsoft.VSCode, key: ApplePressAndHoldEnabled, type: bool, value: false }
  - { domain: com.jetbrains.goland, key: ApplePressAndHoldEnabled, type: bool, value: false }
  - { domain: com.apple.Terminal, key: ApplePressAndHoldEnabled, type: bool, value: false }

# ── Paths ───────────────────────────────────────────────────────────────────
mise_bin: "{{ ansible_env.HOME }}/.local/bin/mise"
secrets_dir: "{{ ansible_env.HOME }}/.config/devsetup"
